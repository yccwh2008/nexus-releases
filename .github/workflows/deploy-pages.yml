name: 部署浏览器发布页

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexus-release-page
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'yccwh2008/nexus-releases' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1
      - name: 部署浏览器发布页
        id: deployment
        uses: actions/deploy-pages@v4
